name: Deployment Status

on:
  push:
    branches: [ main, portfolio_v2 ]

jobs:
  portfolio-health-check:
    name: Portfolio Deployment Health Check
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/portfolio_v2' || github.ref == 'refs/heads/main'
    
    steps:
      - name: Check Portfolio App Status
        run: |
          echo "Checking portfolio deployment health..."
          curl -sSf https://portfolio.frontendonfront.com/ > /dev/null
          echo "✅ Portfolio app is responding successfully"
          
      - name: Performance Check
        run: |
          echo "Running basic performance check..."
          response_time=$(curl -o /dev/null -s -w '%{time_total}' https://portfolio.frontendonfront.com/)
          echo "Response time: ${response_time}s"
          if (( $(echo "$response_time < 3.0" | bc -l) )); then
            echo "✅ Performance check passed (< 3s)"
          else
            echo "⚠️ Performance check warning (> 3s)"
          fi

  notify-success:
    name: Deployment Success Notification
    runs-on: ubuntu-latest
    needs: portfolio-health-check
    if: success()
    
    steps:
      - name: Success notification
        run: |
          echo "🎉 Portfolio deployment verified successfully!"
          echo "🌐 Live at: https://portfolio.frontendonfront.com/"
          echo "📊 All health checks passed" 